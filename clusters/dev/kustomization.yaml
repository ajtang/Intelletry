# Entry point for the dev cluster. The Flux configuration created by
# infrastructure/aks.bicep applies this directory and fills in the variables in
# cluster-settings.yaml. Everything else on the cluster follows from here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cluster-settings.yaml
  - platform.yaml
  - apps.yaml
