apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: telemetry-ingestion
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 20
  - target:
      kind: HorizontalPodAutoscaler
      name: anomaly-engine
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 3
  - target:
      kind: Deployment
      name: "(telemetry-ingestion|anomaly-engine)"
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
images:
  # Tags are copied from dev by the promote workflow, through a reviewed pull request.
  - name: telemetry-ingestion
    newName: ${ACR_LOGIN_SERVER}/telemetry-ingestion
    newTag: unreleased
  - name: anomaly-engine
    newName: ${ACR_LOGIN_SERVER}/anomaly-engine
    newTag: unreleased
  - name: alert-service
    newName: ${ACR_LOGIN_SERVER}/alert-service
    newTag: unreleased
  - name: fleet-dashboard
    newName: ${ACR_LOGIN_SERVER}/fleet-dashboard
    newTag: unreleased
