apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-dashboard
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: fleet-dashboard
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleet-dashboard
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: intelletry
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        # Replicas spread across zones and nodes, so one failure takes out at most one.
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: fleet-dashboard
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: fleet-dashboard
      containers:
        - name: fleet-dashboard
          image: fleet-dashboard
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: API_URL
              value: http://alert-service
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: intelletry-secrets
                  key: API_TOKEN
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets
              readOnly: true
            # Next.js writes its cache here; the rest of the filesystem is read-only.
            - name: next-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: intelletry-keyvault
        - name: next-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
