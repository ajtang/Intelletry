apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: anomaly-engine
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: anomaly-engine
  minReplicas: 2
  maxReplicas: 16
  # More pods than shards would leave some idle, so the maximum matches STREAM_SHARDS.
  # Scale-down waits ten minutes because every change moves shard ownership.
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
