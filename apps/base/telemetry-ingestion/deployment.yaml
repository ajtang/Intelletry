apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-ingestion
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: telemetry-ingestion
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telemetry-ingestion
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: intelletry
      # Leaves time to fail readiness, drain in-flight batches and close gRPC streams.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        # Replicas spread across zones and nodes, so one failure takes out at most one.
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: telemetry-ingestion
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: telemetry-ingestion
      containers:
        - name: telemetry-ingestion
          image: telemetry-ingestion
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: pipeline-config
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: intelletry-secrets
                  key: REDIS_URL
            - name: INGEST_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: intelletry-secrets
                  key: INGEST_API_KEYS
            - name: SHUTDOWN_GRACE
              value: 10s
            - name: STREAM_MAX_LEN
              value: "200000"
            # Lets the Go runtime collect garbage before the container hits its limit.
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
                  divisor: "1"
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          # Liveness ignores dependencies, so a Redis outage does not restart every pod.
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            # No CPU limit: throttling would add latency spikes. Requests drive scheduling
            # and the autoscaler.
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets
              readOnly: true
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: intelletry-keyvault
