# Reads secrets from Azure Key Vault and mirrors them into the intelletry-secrets Secret.
# The mirror exists only while at least one pod mounts this provider, so every workload
# that needs a secret mounts it.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: intelletry-keyvault
spec:
  provider: azure
  parameters:
    clientID: ${WORKLOAD_CLIENT_ID}
    keyvaultName: ${KEYVAULT_NAME}
    tenantId: ${TENANT_ID}
    objects: |
      array:
        - |
          objectName: redis-url
          objectType: secret
        - |
          objectName: database-url
          objectType: secret
        - |
          objectName: api-token
          objectType: secret
        - |
          objectName: ingest-api-keys
          objectType: secret
  secretObjects:
    - secretName: intelletry-secrets
      type: Opaque
      data:
        - objectName: redis-url
          key: REDIS_URL
        - objectName: database-url
          key: DATABASE_URL
        - objectName: api-token
          key: API_TOKEN
        - objectName: ingest-api-keys
          key: INGEST_API_KEYS
