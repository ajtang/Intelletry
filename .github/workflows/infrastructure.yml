# Deploys infrastructure/ to one environment. The plan (what-if) runs first, and the
# GitHub environment's protection rules decide who must approve before the apply step.
name: Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [dev, prod]
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
      PARAMS: infrastructure/environments/${{ inputs.environment }}.bicepparam
      ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
      POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
      API_TOKEN: ${{ secrets.API_TOKEN }}
      INGEST_API_KEYS: ${{ secrets.INGEST_API_KEYS }}
      SIMULATOR_INGEST_KEY: ${{ secrets.SIMULATOR_INGEST_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Preview changes
        run: az deployment group what-if --resource-group "$RESOURCE_GROUP" --parameters "$PARAMS"
      - name: Deploy
        run: |
          az deployment group create --resource-group "$RESOURCE_GROUP" --parameters "$PARAMS" \
            --name "intelletry-${{ github.run_number }}" --output none
