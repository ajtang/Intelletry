version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /services/fleet-dashboard
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /services/telemetry-ingestion
      - /services/anomaly-engine
      - /services/alert-service
      - /services/vehicle-simulator
      - /services/fleet-dashboard
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
